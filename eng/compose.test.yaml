# Throwaway services for MP Core's integration tests. Nothing here is a production setting.
#   docker compose -f eng/compose.test.yaml up -d
#   docker compose -f eng/compose.test.yaml down -v
name: mpcore-tests
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: mpcore
      POSTGRES_PASSWORD: mpcore
      POSTGRES_DB: mpcore_it
    ports: ["54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpcore -d mpcore_it"]
      interval: 5s
      timeout: 3s
      retries: 20
  timescale:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_USER: mpcore
      POSTGRES_PASSWORD: mpcore
      POSTGRES_DB: mpcore_it
    ports: ["54330:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpcore -d mpcore_it"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.0-alpine
    ports: ["56390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mpcore
      RABBITMQ_DEFAULT_PASS: mpcore
    ports: ["56720:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 30
  # One node that is its own controller (KRaft). The address it gives clients is the one on this machine.
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:59094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,EXTERNAL://localhost:59094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: mPc0reTestsKafka00001w
    ports: ["59094:59094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
