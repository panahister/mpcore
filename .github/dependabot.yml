# Proposes updates once a month. A proposal is a pull request: CI runs on it, and a person merges it.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      wolverine:
        patterns: ["WolverineFx*", "JasperFx*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
