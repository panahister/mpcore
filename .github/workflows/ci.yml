# Builds and tests every push and pull request. It never publishes: packing for publication and the push
# to nuget.org are a maintainer's act (docs/decisions/ADR-004, ADR-010).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: mpcore
          POSTGRES_PASSWORD: mpcore
          POSTGRES_DB: mpcore_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpcore -d mpcore_it" --health-interval 5s --health-timeout 3s --health-retries 20
      timescale:
        image: timescale/timescaledb:2.17.2-pg17
        env:
          POSTGRES_USER: mpcore
          POSTGRES_PASSWORD: mpcore
          POSTGRES_DB: mpcore_it
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mpcore -d mpcore_it" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.0-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1.4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: mpcore
          RABBITMQ_DEFAULT_PASS: mpcore
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running" --health-interval 5s --health-timeout 10s --health-retries 30
      # One Kafka node that is its own controller (KRaft); the address it gives clients is the runner's.
      kafka:
        image: apache/kafka:4.0.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,EXTERNAL://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          CLUSTER_ID: mPc0reTestsKafka00001w
        ports: ["9094:9094"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" --health-interval 5s --health-timeout 10s --health-retries 30 --health-start-period 20s
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Throwaway service containers of this job; not a secret.
      MPCORE_TEST_POSTGRESQL: Host=localhost;Port=5432;Database=mpcore_it;Username=mpcore;Password=mpcore
      MPCORE_TEST_TIMESCALE: Host=localhost;Port=5433;Database=mpcore_it;Username=mpcore;Password=mpcore
      MPCORE_TEST_REDIS: localhost:6379
      MPCORE_TEST_RABBITMQ: amqp://mpcore:mpcore@localhost:5672
      MPCORE_TEST_KAFKA: localhost:9094
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the version check reads the commit that published the declared version.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore the API-compatibility baseline from nuget.org
        run: ./eng/restore-api-baseline.sh
      - name: A changed cohort moves its version (ADR-010)
        run: |
          ./eng/check-version-moved.sh --self-test
          ./eng/check-version-moved.sh
      - name: Restore (locked)
        run: dotnet restore MPCore.sln --locked-mode
      - name: Build (warnings are errors)
        run: dotnet build MPCore.sln --configuration Release --no-restore
      # The fast run. The tests that generate a backend from the template and build it, and the one that packs a
      # package, take minutes and use the network; they run in their own job below, and in the release gate.
      - name: Test
        run: dotnet test MPCore.sln --configuration Release --no-build --filter "Category!=Generated&Category!=Packaging" --logger "trx;LogFileName=results.trx"
      - name: Pack (a verification candidate, never published from here)
        run: dotnet pack MPCore.sln --configuration Release --no-build --output artifacts/candidate -p:VersionSuffix=ci.${{ github.run_number }}
      - name: A consumer can pin the commit the packages record
        run: |
          declared="$(sed -n 's/.*<VersionPrefix>\(.*\)<\/VersionPrefix>.*/\1/p' src/Directory.Build.props | head -1)"
          ./eng/verify-consumer-pin.sh artifacts/candidate "$declared-ci.${{ github.run_number }}" "$(git rev-parse HEAD)"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/results.trx"

  # The slow tests: a backend generated from the template, built against this source and run, and a package packed
  # inside a test. They restore third-party packages from the network and take minutes, so they do not slow the run
  # above. The release workflow runs every test, these included.
  generated-and-packaged:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: mpcore
          POSTGRES_PASSWORD: mpcore
          POSTGRES_DB: mpcore_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpcore -d mpcore_it" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # A throwaway service container of this job; not a secret. The generated host keeps its messages there.
      MPCORE_TEST_POSTGRESQL: Host=localhost;Port=5432;Database=mpcore_it;Username=mpcore;Password=mpcore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore MPCore.sln --locked-mode
      - name: Build (warnings are errors)
        run: dotnet build MPCore.sln --configuration Release --no-restore
      - name: Test (generated backends and packing)
        run: dotnet test MPCore.sln --configuration Release --no-build --filter "Category=Generated|Category=Packaging" --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-generated-and-packaged
          path: "**/results.trx"
